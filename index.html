<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Batch Log</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h2 { color: #005a9c; margin-top: 0; }
        label { font-weight: bold; display: block; margin: 10px 0 5px; }
        select, input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .pump-entry { border-left: 5px solid #005a9c; padding-left: 15px; margin-bottom: 20px; background: #fafafa; padding-top: 10px; padding-bottom: 10px; }
        .btn { background: #005a9c; color: white; padding: 15px; border: none; width: 100%; border-radius: 5px; font-size: 18px; cursor: pointer; margin-top: 10px; }
        .btn-add { background: #28a745; margin-bottom: 20px; }
        .btn-remove { background: #dc3545; padding: 5px 10px; font-size: 12px; width: auto; float: right; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Maintenance Header</h2>
        <label>Technician Name</label>
        <input type="text" id="techName" placeholder="Enter your name">
        
        <label>Area</label>
        <select id="area">
            <option>Area 100</option>
            <option>Area 200</option>
            <option>Area 300</option>
        </select>
    </div>

    <div id="pumpContainer">
        <!-- Pump entries will appear here -->
    </div>

    <button class="btn btn-add" onclick="addPump()">+ Add Another Pump</button>
    <button class="btn" onclick="submitAll()">SUBMIT ALL TO OFFICE</button>

    <script>
        // Hardcoded tags for Karachi Plant
        const tags = ["G-101-A", "G-101-B", "K-1003", "P-502", "G-201-A"];

        function addPump() {
            const container = document.getElementById('pumpContainer');
            const div = document.createElement('div');
            div.className = 'card pump-entry';
            div.innerHTML = `
                <button class="btn btn-remove" onclick="this.parentElement.remove()">X Remove</button>
                <label>Pump Tag</label>
                <select class="pTag">${tags.map(t => `<option>${t}</option>`).join('')}</select>
                <label>Oil Condition</label>
                <select class="pCond"><option>Good</option><option>Contaminated</option><option>Low</option></select>
                <label>Action Taken</label>
                <input type="text" class="pAction" placeholder="e.g. Topped up 2L">
            `;
            container.appendChild(div);
        }

        function submitAll() {
            const tech = document.getElementById('techName').value;
            const area = document.getElementById('area').value;
            const pumps = document.getElementsByClassName('pump-entry');
            let data = [];

            if(!tech) { alert("Please enter your name"); return; }

            for (let p of pumps) {
                data.push({
                    Tag: p.querySelector('.pTag').value,
                    Cond: p.querySelector('.pCond').value,
                    Action: p.querySelector('.pAction').value
                });
            }

            // Convert to JSON and send via Email (The Zero-License Bridge)
            const body = `TECH:${tech}|AREA:${area}|DATA:${JSON.stringify(data)}`;
            window.location.href = `mailto:YOUR_WORK_EMAIL@company.com?subject=OilLogBatch&body=${encodeURIComponent(body)}`;
            alert("Submission ready! Please hit 'Send' in your email app.");
        }

        // Start with one pump
        addPump();
    </script>
</body>
</html>
