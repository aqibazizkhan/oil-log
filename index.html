<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFBL Horizontal Log</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; margin: 0; padding: 5px; }
        .wrapper { background: white; border: 1px solid #000; overflow: hidden; }
        
        /* Header Info */
        .meta-info { display: flex; flex-wrap: wrap; background: #eee; border-bottom: 2px solid #000; padding: 5px; font-size: 11px; }
        .meta-info div { margin-right: 15px; margin-bottom: 5px; }
        .meta-info input { border: none; border-bottom: 1px solid #333; background: transparent; width: 80px; }

        /* THE TABLE SCROLL ENGINE */
        .table-container { 
            overflow-x: auto; /* Allows side-to-side swiping */
            width: 100%;
            position: relative;
        }

        table { border-collapse: collapse; min-width: 1200px; /* Forces enough width for columns */ }
        
        th, td { 
            border: 1px solid #000; 
            padding: 8px; 
            text-align: center; 
            font-size: 12px; 
        }

        th { background-color: #343a40; color: white; height: 40px; }

        /* STICKY COLUMN: This keeps the Tag # visible while swiping */
        .sticky-col {
            position: sticky;
            left: 0;
            background-color: #ffeb3b !important; /* Yellow like a highlight */
            z-index: 2;
            border-right: 2px solid #000;
            font-weight: bold;
            color: #000 !important;
            min-width: 100px;
        }

        input, select { 
            width: 90%; 
            padding: 5px; 
            border: 1px solid #ccc; 
            border-radius: 3px; 
            font-size: 14px;
        }

        /* Fixed widths for columns to keep things readable */
        .col-tag { width: 100px; }
        .col-small { width: 80px; }
        .col-med { width: 150px; }

        .btn-add { background: #28a745; color: white; padding: 10px; border: none; margin: 10px; cursor: pointer; width: calc(100% - 20px); font-weight: bold; }
        .btn-send { background: #0056b3; color: white; padding: 15px; border: none; margin: 10px; cursor: pointer; width: calc(100% - 20px); font-weight: bold; font-size: 16px; }

    </style>
</head>
<body>

<div class="wrapper">
    <div class="meta-info">
        <div>Date: <input type="date" id="dated"></div>
        <div>Plant: <input type="text" id="plant" placeholder="Area"></div>
        <div>Tech: <input type="text" id="tech" placeholder="Name"></div>
    </div>

    <div class="table-container">
        <table id="pumpTable">
            <thead>
                <tr>
                    <th class="sticky-col">TAG #</th>
                    <th class="col-small">1. Lvl Inc?</th>
                    <th class="col-small">2. Qty Drain</th>
                    <th class="col-small">3. Color</th>
                    <th class="col-med">4. Impurities</th>
                    <th class="col-small">5. Supply Line</th>
                    <th class="col-small">8. Oil Type</th>
                    <th class="col-small">9. Cond Filled</th>
                    <th class="col-small">11. Qty New</th>
                    <th class="col-med">Comments</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td class="sticky-col"><input type="text" class="t-tag" placeholder="G-101"></td>
                    <td><select class="t-l1"><option>Yes</option><option>No</option></select></td>
                    <td><input type="text" class="t-l2"></td>
                    <td><input type="text" class="t-l3"></td>
                    <td><input type="text" class="t-l4"></td>
                    <td><select class="t-l5"><option>Open</option><option>Chocked</option></select></td>
                    <td><input type="text" class="t-l8"></td>
                    <td><input type="text" class="t-l9"></td>
                    <td><input type="number" class="t-l11"></td>
                    <td><input type="text" class="t-comment"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <button class="btn-add" onclick="addRow()">+ ADD ANOTHER PUMP ROW</button>
    <button class="btn-send" onclick="sendData()">FINISH & SEND BATCH</button>
</div>

<script>
    document.getElementById('dated').valueAsDate = new Date();

    function addRow() {
        const tbody = document.getElementById('tableBody');
        const newRow = tbody.rows[0].cloneNode(true);
        // Clear inputs in cloned row
        newRow.querySelectorAll('input').forEach(i => i.value = "");
        tbody.appendChild(newRow);
    }

    function sendData() {
        const rows = document.querySelectorAll('#tableBody tr');
        let batch = [];
        
        rows.forEach(row => {
            const tag = row.querySelector('.t-tag').value;
            if(tag) {
                batch.push({
                    Tag: tag,
                    L1: row.querySelector('.t-l1').value,
                    L2: row.querySelector('.t-l2').value,
                    L3: row.querySelector('.t-l3').value,
                    L4: row.querySelector('.t-l4').value,
                    L5: row.querySelector('.t-l5').value,
                    L8: row.querySelector('.t-l8').value,
                    L9: row.querySelector('.t-l9').value,
                    L11: row.querySelector('.t-l11').value,
                    Comment: row.querySelector('.t-comment').value
                });
            }
        });

        if(batch.length === 0) return;
        const meta = `DATED:${document.getElementById('dated').value}|PLANT:${document.getElementById('plant').value}`;
        const body = `${meta}\n\nDATA:${JSON.stringify(batch)}`;
        window.location.href = `mailto:javed@example.com?subject=OilLogBatch&body=${encodeURIComponent(body)}`;
    }
</script>

</body>
</html>
