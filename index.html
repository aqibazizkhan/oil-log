<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFBL Machinery Maintenance</title>
    <style>
        :root { --ffbl-blue: #0056b3; --ffbl-grey: #343a40; --ffbl-border: #000; }
        body { font-family: sans-serif; background-color: #e9ecef; margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: 0 auto; background: white; border: 2px solid var(--ffbl-border); }
        
        /* Header Section */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 2px solid var(--ffbl-border); background: #fff; }
        .header-logo { font-weight: bold; font-size: 24px; color: var(--ffbl-blue); }
        .header-title { text-align: center; flex-grow: 1; font-size: 14px; font-weight: bold; }
        
        /* Meta Data Section */
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 2px solid var(--ffbl-border); font-size: 12px; }
        .meta-grid div { padding: 5px; border: 0.5px solid #ccc; }
        .meta-grid input { width: 90%; border: none; border-bottom: 1px solid #999; outline: none; }

        /* Accordion Styling */
        .section-header { background: var(--ffbl-grey); color: white; padding: 12px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid #fff; }
        .section-content { padding: 10px; display: block; border-bottom: 2px solid var(--ffbl-border); }
        
        /* Input Cards */
        .card { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .card label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #444; }
        .card select, .card input { width: 100%; padding: 8px; border: 1px solid #999; border-radius: 4px; font-size: 16px; }

        /* Clone/Action Buttons */
        .btn-group { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .btn { padding: 15px; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; color: white; }
        .btn-clone { background: #28a745; }
        .btn-submit { background: var(--ffbl-blue); }

        /* Batch Log Summary */
        #logSummary { padding: 10px; background: #fff; border-top: 2px solid var(--ffbl-border); }
        .log-entry { border: 1px solid #ccc; padding: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-logo">FFBL</div>
        <div class="header-title">OIL REPLACEMENT / INSPECTION<br>CHECKLIST</div>
    </div>

    <div class="meta-grid">
        <div>Date: <input type="date" id="dated"></div>
        <div>Plant/Area: <input type="text" id="plantArea" placeholder="e.g. Area 100"></div>
        <div>Name: <input type="text" id="jmcName" placeholder="Employee Name"></div>
        <div>P.No: <input type="text" id="pNo" placeholder="Personal No"></div>
    </div>

    <div style="padding: 10px; background: #ffeb3b; font-weight: bold; text-align: center; border-bottom: 2px solid black;">
        TAG ID: <input type="text" id="logTag" style="font-size: 18px; width: 60%;" placeholder="e.g. G-101-A">
    </div>

    <div class="section-header" onclick="toggleSec('sec1')"><span>1. PRE-JOB PREP</span><span>▼</span></div>
    <div id="sec1" class="section-content">
        <div class="card"><label>1. Oil level slightly increased?</label><select id="l1"><option>Yes</option><option>No</option></select></div>
        <div class="card"><label>12. Housing cleaned/Housekeeping?</label><select id="l12"><option>Yes</option><option>No</option></select></div>
        <div class="card"><label>13. Dead plug installed?</label><select id="l13"><option>Yes</option><option>No</option></select></div>
    </div>

    <div class="section-header" onclick="toggleSec('sec2')"><span>2. DRAINING PHASE</span><span>▼</span></div>
    <div id="sec2" class="section-content">
        <div class="card"><label>2. Qty Drained (Ltr)</label><input type="text" id="l2"></div>
        <div class="card"><label>3. Color of Drained Oil</label><input type="text" id="l3" placeholder="Normal/Black"></div>
        <div class="card"><label>4. Impurities</label><input type="text" id="l4" placeholder="None/Sand/Metal"></div>
        <div class="card"><label>5. Oil Supply Line</label><select id="l5"><option>Open</option><option>Chocked/Cleaned</option></select></div>
    </div>

    <div class="section-header" onclick="toggleSec('sec3')"><span>3. REFILLING PHASE</span><span>▼</span></div>
    <div id="sec3" class="section-content">
        <div class="card"><label>8. Type of Oil Filled</label><input type="text" id="l8"></div>
        <div class="card"><label>9. Condition of Oil Filled</label><input type="text" id="l9" placeholder="Clean/Dirty"></div>
        <div class="card"><label>11. Qty New Oil (Ltr)</label><input type="number" id="l11"></div>
        <div class="card"><label>Comments</label><input type="text" id="comment"></div>
    </div>

    <div class="btn-group">
        <button class="btn btn-clone" onclick="saveToBatch(true)">ADD & CLONE FOR NEXT PUMP</button>
        <button class="btn btn-submit" onclick="finishBatch()">FINISH & SEND BATCH</button>
    </div>

    <div id="logSummary">
        <strong>Batch Log:</strong>
        <div id="logList"></div>
    </div>
</div>

<script>
    let batchData = [];
    document.getElementById('dated').valueAsDate = new Date();

    function toggleSec(id) {
        let x = document.getElementById(id);
        x.style.display = (x.style.display === "none") ? "block" : "none";
    }

    function saveToBatch(isClone) {
        const tag = document.getElementById('logTag').value;
        if(!tag) { alert("Enter TAG ID"); return; }

        const data = {
            Tag: tag,
            L1: document.getElementById('l1').value,
            L2: document.getElementById('l2').value,
            L3: document.getElementById('l3').value,
            L4: document.getElementById('l4').value,
            L5: document.getElementById('l5').value,
            L8: document.getElementById('l8').value,
            L9: document.getElementById('l9').value,
            L11: document.getElementById('l11').value,
            L12: document.getElementById('l12').value,
            L13: document.getElementById('l13').value,
            Comment: document.getElementById('comment').value
        };

        batchData.push(data);
        renderLog();

        if(!isClone) {
            // Reset fields
            document.querySelectorAll('input:not(#dated):not(#jmcName):not(#pNo):not(#plantArea)').forEach(i => i.value = "");
        } else {
            alert("Pump " + tag + " saved. Modify Tag for the cloned entry.");
            document.getElementById('logTag').value = ""; // Just clear tag for the next one
        }
    }

    function renderLog() {
        const list = document.getElementById('logList');
        list.innerHTML = batchData.map((d, i) => `<div class="log-entry"><span>${i+1}. ${d.Tag}</span><button onclick="batchData.splice(${i},1);renderLog()">Delete</button></div>`).join('');
    }

    function finishBatch() {
        if(batchData.length === 0) return;
        const meta = `DATED:${document.getElementById('dated').value}|PLANT:${document.getElementById('plantArea').value}|TECH:${document.getElementById('jmcName').value}`;
        const body = `${meta}\n\nDATA:${JSON.stringify(batchData)}`;
        window.location.href = `mailto:javed@example.com?subject=OilLogBatch&body=${encodeURIComponent(body)}`;
    }
</script>
</body>
</html>
